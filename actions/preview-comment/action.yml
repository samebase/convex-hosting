name: convex-hosting preview comment
description: >-
  On a pull request, posts the preview URL in one comment and edits that comment on later runs.
inputs:
  url:
    description: The preview URL, from the deploy action's url output.
    required: true
  title:
    description: The text before the URL. Each title keeps its own comment.
    default: Preview
runs:
  using: composite
  steps:
    # The comment starts with a hidden marker that holds the title. The search keeps only comments
    # by github-actions[bot], the user of github.token, so a pasted marker cannot redirect the edit.
    - name: Post the preview URL
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        MARKER: "<!-- convex-hosting preview: ${{ inputs.title }} -->"
        BODY: "${{ inputs.title }}: ${{ inputs.url }}"
      run: |
        ids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq \
          '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id')
        if [ -n "$ids" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/${ids%%$'\n'*}" -f body="$MARKER $BODY" > /dev/null
        else
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$MARKER $BODY" > /dev/null
        fi
