name: Convex preview of a pull request
description: >-
  Deploys a pull request's Convex app to the preview named after its branch, outputs its URLs, and
  keeps a pull request comment with its links.
inputs:
  deploy-key:
    description:
      The project's preview deploy key, which must start with preview:. Empty deploys nothing.
    required: true
  working-directory:
    description: The directory of the app's package.json.
    default: .
  comment:
    description: Keep a pull request comment with the preview's links; needs pull-requests write.
    default: "true"
outputs:
  url:
    description: The site URL (CONVEX_SITE_URL). Empty when nothing deployed or not readable.
    value: ${{ steps.deploy.outputs.url }}
  deployment-url:
    description: The deployment URL (CONVEX_CLOUD_URL). Empty when nothing deployed or not readable.
    value: ${{ steps.deploy.outputs.deployment-url }}
  dashboard-url:
    description: The deployment's page in the Convex dashboard. Empty when unknown.
    value: ${{ steps.deploy.outputs.dashboard-url }}
  preview-name:
    description: The preview's name, the branch. Empty when nothing deployed.
    value: ${{ steps.deploy.outputs.preview-name }}
runs:
  using: composite
  steps:
    - name: Deploy the preview
      id: deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONVEX_DEPLOY_KEY: ${{ inputs.deploy-key }}
        TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        if [ -z "$CONVEX_DEPLOY_KEY" ]; then
          echo "::notice::No preview: set CONVEX_PREVIEW_DEPLOY_KEY and pass it as deploy-key."
          exit 0
        fi
        if [[ $CONVEX_DEPLOY_KEY != preview:* ]]; then
          echo "::error::deploy-key is not a preview deploy key (preview:...). Convex was not deployed: npx convex deploy with a production key ignores --preview-name and deploys the pull request to production."
          exit 1
        fi

        # A re-run of an old run, or a checkout of another commit, must not put older code over newer
        # code. The job token lets git read a private repository; the deploy script does not get it.
        auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
        head=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_HEAD_REF" | cut -f1)
        unset TOKEN auth
        if [ "$(git rev-parse HEAD)" != "$head" ]; then
          echo "::error::The checkout is not the head of $GITHUB_HEAD_REF ($head): check out the head commit. Convex was not deployed."
          exit 1
        fi

        # node --run puts node_modules/.bin on PATH and appends the arguments to the script's last
        # command.
        if [ -n "$(jq -r '.scripts.deploy // empty' package.json)" ]; then
          node --run deploy -- --preview-name "$GITHUB_HEAD_REF"
        else
          npx convex deploy --preview-name "$GITHUB_HEAD_REF"
        fi

        # The deployment's own URLs are right in every region.
        if ! urls=$(npx convex run --inline-query "[process.env.CONVEX_SITE_URL, process.env.CONVEX_CLOUD_URL]" --preview-name "$GITHUB_HEAD_REF"); then
          echo "::warning::Convex is deployed, but the key cannot run the inline query that reads the deployment's URLs (deployment:functions:runTestQuery), so url and deployment-url are empty."
          urls='["", ""]'
        fi
        url=$(jq -r '.[0]' <<< "$urls")
        deployment_url=$(jq -r '.[1]' <<< "$urls")
        # A preview's name is its .convex.cloud host's first label.
        dashboard_url=""
        if [[ $deployment_url =~ ^https://([^.]+)\..*convex\.cloud$ ]]; then
          dashboard_url=https://dashboard.convex.dev/d/${BASH_REMATCH[1]}
        fi

        {
          echo "url=$url"
          echo "deployment-url=$deployment_url"
          echo "dashboard-url=$dashboard_url"
          echo "preview-name=$GITHUB_HEAD_REF"
        } >> "$GITHUB_OUTPUT"
        {
          echo "- Site: ${url:-unknown}"
          echo "- Deployment: ${deployment_url:-unknown}"
          echo "- Dashboard: ${dashboard_url:-unknown}"
        } >> "$GITHUB_STEP_SUMMARY"

    # One comment per app and pull request: the header names the app's directory.
    - name: Comment the preview's links
      if: inputs.comment == 'true' && github.event.pull_request.number && steps.deploy.outputs.url
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: preview ${{ inputs.working-directory }}
        message: |
          Preview `${{ steps.deploy.outputs.preview-name }}`${{ inputs.working-directory != '.' && format(' of {0}', inputs.working-directory) || '' }}: ${{ steps.deploy.outputs.url }}
          Deployment: ${{ steps.deploy.outputs.deployment-url }}
          Dashboard: ${{ steps.deploy.outputs.dashboard-url }}
