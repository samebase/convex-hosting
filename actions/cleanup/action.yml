name: Convex preview cleanup
description: >-
  Deletes the Convex preview named after the branch of a closed pull request, and notes it in the
  preview's pull request comment.
inputs:
  deploy-key:
    description:
      The project's preview deploy key, which must start with preview:. Empty deletes nothing.
    required: true
  working-directory:
    description: The preview's working-directory, which names its comment.
    default: .
  comment:
    description: Note the delete in the preview's pull request comment; needs pull-requests write.
    default: "true"
runs:
  using: composite
  steps:
    - name: Delete the preview
      shell: bash
      env:
        CONVEX_DEPLOY_KEY: ${{ inputs.deploy-key }}
      run: |
        set -euo pipefail

        if [ -z "$CONVEX_DEPLOY_KEY" ]; then
          echo "No preview deleted: deploy-key is empty."
          exit 0
        fi
        # A preview deploy key names its team and project: preview:<team>:<project>|<secret>.
        IFS=: read -r kind team project <<< "${CONVEX_DEPLOY_KEY%%|*}"
        if [ "$kind" != preview ]; then
          echo "::error::deploy-key is not a preview deploy key (preview:...)."
          exit 1
        fi

        # Prints the response of the Convex management API, or fails with it.
        api() {
          local body
          if ! body=$(curl -sS --fail-with-body -X "$1" -H "Authorization: Bearer $CONVEX_DEPLOY_KEY" "https://api.convex.dev/v1/$2"); then
            echo "$1 $2: $body" >&2
            return 1
          fi
          printf '%s' "$body"
        }

        project_id=$(api GET "teams/$team/projects/$project" | jq -r .id)
        names=$(api GET "projects/$project_id/list_deployments?deploymentType=preview" | jq -r --arg name "$GITHUB_HEAD_REF" '.[] | select(.previewIdentifier == $name) | .name')
        if [ -z "$names" ]; then
          echo "No preview named $GITHUB_HEAD_REF in $project."
        fi
        for name in $names; do
          api POST "deployments/$name/delete" > /dev/null
          echo "Deleted the preview $GITHUB_HEAD_REF ($name) in $project."
        done

    - name: Note the deleted preview in the comment
      if: inputs.comment == 'true' && inputs.deploy-key
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: preview ${{ inputs.working-directory }}
        append: true
        only_update: true
        message: Preview deleted when the pull request closed.
