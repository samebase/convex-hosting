name: Convex deploy with previews deleted on close
description: >-
  Deploys a Convex app to production, or to the preview pr-<number> of a pull request, after it
  checks that the checkout is the head of its branch, and reads the site URL from the Convex API.
  When the pull request closes, deletes that preview instead.
inputs:
  deploy-key:
    description: >-
      The Convex deploy key, from a secret: the production key, or the project's preview deploy key
      on a pull request.
    required: true
  working-directory:
    description: The directory of the app's package.json.
    default: .
outputs:
  url:
    description: >-
      The site URL, https://<deployment>.convex.site, from the Convex API. Empty when a preview was
      deleted.
    value: ${{ steps.url.outputs.url }}
runs:
  using: composite
  steps:
    # A re-run of an old run deploys its old commit, so its push would put older code over newer
    # code. The caller's concurrency group orders runs; this refuses a stale one. On pull_request,
    # actions/checkout takes a merge commit by default, which changes when the base moves, so the
    # checkout must be the head commit itself.
    - name: Check that the checkout is the head of its branch
      if: github.event.action != 'closed'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
          echo "::error::The checkout is not $SHA. Give actions/checkout the pull request's head commit as its ref."
          exit 1
        fi
        if [ -n "$PR" ]; then
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"\(.state) \(.head.sha)"')
          if [ "${pr% *}" != open ]; then
            echo "::error::Pull request $PR is closed, so its preview is not deployed again."
            exit 1
          fi
          head=${pr#* }
        else
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/${GITHUB_REF#refs/}" --jq .sha)
        fi
        if [ "$head" != "$SHA" ]; then
          echo "::error::$SHA is stale: its branch now points to $head. Convex was not deployed."
          exit 1
        fi

    # npx convex deploy sends --preview-name with a production key to production, so the key's
    # prefix (prod:<deployment> or preview:<team>:<project>) must match the event. node --run runs
    # the deploy script with the node_modules/.bin folders on PATH, whatever the package manager.
    - name: Deploy
      if: github.event.action != 'closed'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONVEX_DEPLOY_KEY: ${{ inputs.deploy-key }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        kind=${CONVEX_DEPLOY_KEY%%:*}
        if [ -n "$PR" ] && [ "$kind" != preview ]; then
          echo "::error::On a pull request, deploy-key must be the project's preview deploy key. A pull request from a fork gets no secrets; skip its job."
          exit 1
        fi
        if [ -z "$PR" ] && [ "$kind" != prod ]; then
          echo "::error::Outside a pull request, deploy-key must be a production deploy key."
          exit 1
        fi
        args=()
        if [ -n "$PR" ]; then
          args=(--preview-name "pr-$PR")
        fi
        if [ -n "$(jq -r '.scripts.deploy // empty' package.json)" ]; then
          node --run deploy -- "${args[@]}"
        else
          npx convex deploy "${args[@]}"
        fi

    # The management API gives each deployment's deploymentUrl, which ends in .convex.cloud; the
    # site, where its HTTP actions answer, is the same host with .convex.site.
    - name: Read the site URL from the Convex API
      id: url
      if: github.event.action != 'closed'
      shell: bash
      env:
        CONVEX_DEPLOY_KEY: ${{ inputs.deploy-key }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        api() {
          local body
          body=$(curl -sS --fail-with-body -H "Authorization: Bearer $CONVEX_DEPLOY_KEY" "https://api.convex.dev/v1/$1" "${@:2}") ||
            { echo "$1: $body" >&2; return 1; }
          printf '%s' "$body"
        }
        IFS=: read -r kind first second <<< "${CONVEX_DEPLOY_KEY%%|*}"
        if [ "$kind" = preview ]; then
          id=$(api "teams/$first/projects/$second" | jq -r .id)
          cloud=$(api "projects/$id/list_deployments?deploymentType=preview" |
            jq -r --arg name "pr-$PR" '.[] | select(.previewIdentifier == $name) | .deploymentUrl')
        else
          cloud=$(api "deployments/$first" | jq -r .deploymentUrl)
        fi
        if ! [[ $cloud =~ ^https://[a-z0-9.-]+\.convex\.cloud$ ]]; then
          echo "::error::The Convex API returned no single deployment URL: $cloud"
          exit 1
        fi
        echo "url=${cloud%.convex.cloud}.convex.site" >> "$GITHUB_OUTPUT"

    # A preview deploy key may read its project's deployments and delete its previews through the
    # management API.
    - name: Delete the preview of the closed pull request
      if: github.event.action == 'closed'
      shell: bash
      env:
        CONVEX_DEPLOY_KEY: ${{ inputs.deploy-key }}
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        # A re-run of an old closed run must not delete the preview of a reopened pull request.
        state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .state)
        if [ "$state" != closed ]; then
          echo "Pull request $PR is $state again, so its preview stays."
          exit 0
        fi
        IFS=: read -r kind team project <<< "${CONVEX_DEPLOY_KEY%%|*}"
        if [ "$kind" != preview ]; then
          echo "::error::deploy-key is not a preview deploy key. A pull request from a fork gets no secrets; skip its job."
          exit 1
        fi
        api() {
          local body
          body=$(curl -sS --fail-with-body -H "Authorization: Bearer $CONVEX_DEPLOY_KEY" "https://api.convex.dev/v1/$1" "${@:2}") ||
            { echo "$1: $body" >&2; return 1; }
          printf '%s' "$body"
        }
        id=$(api "teams/$team/projects/$project" | jq -r .id)
        names=$(api "projects/$id/list_deployments?deploymentType=preview" |
          jq -r --arg name "pr-$PR" '.[] | select(.previewIdentifier == $name) | .name')
        if [ -z "$names" ]; then
          echo "No preview named pr-$PR in $project."
        fi
        for name in $names; do
          api "deployments/$name/delete" -X POST > /dev/null
          echo "Deleted the preview pr-$PR ($name) in $project."
        done
