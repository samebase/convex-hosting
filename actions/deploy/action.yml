name: Convex deploy with previews deleted on close
description: >-
  Deploys a Convex app to production on a push, or to the preview pr-<number> of a pull request,
  after it checks that the checkout is the head of its branch, and outputs the site URL. When the
  pull request closes, deletes that preview.
inputs:
  deploy-key:
    description: The production deploy key, from a secret.
    required: true
  preview-deploy-key:
    description: >-
      The project's preview deploy key, from a secret. Without it, a pull request deploys nothing
      and the job notes how to get previews.
    default: ""
  working-directory:
    description: The directory of the app's package.json.
    default: .
outputs:
  url:
    description: The site URL, where the deployment's HTTP actions answer. Empty when none deployed.
    value: ${{ steps.deploy.outputs.url }}
runs:
  using: composite
  steps:
    - name: Note the missing preview deploy key
      if: github.event.pull_request && !inputs.preview-deploy-key
      shell: bash
      run: |
        note="Set the CONVEX_PREVIEW_DEPLOY_KEY secret to get a preview deployment per pull request."
        echo "::notice::$note"
        echo "$note" >> "$GITHUB_STEP_SUMMARY"

    # A re-run of an old run deploys its old commit, so its push would put older code over newer
    # code. The caller's concurrency group orders runs; this refuses a stale one. On pull_request,
    # actions/checkout takes a merge commit by default, which changes when the base moves, so the
    # checkout must be the head commit itself.
    - name: Check that the checkout is the head of its branch
      if: >-
        github.event.action != 'closed' && (!github.event.pull_request || inputs.preview-deploy-key)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
          echo "::error::The checkout is not $SHA. Give actions/checkout the pull request's head commit as its ref."
          exit 1
        fi
        if [ -n "$PR" ]; then
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"\(.state) \(.head.sha)"')
          if [ "${pr% *}" != open ]; then
            echo "::error::Pull request $PR is closed, so its preview is not deployed again."
            exit 1
          fi
          head=${pr#* }
        else
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/${GITHUB_REF#refs/}" --jq .sha)
        fi
        if [ "$head" != "$SHA" ]; then
          echo "::error::$SHA is stale: its branch now points to $head. Convex was not deployed."
          exit 1
        fi

    # Runs the app's deploy script, or npx convex deploy; node --run puts the node_modules/.bin
    # folders on PATH, whatever the package manager. A pull request's step gets only the preview
    # key, so the app's code never holds the production key there.
    - name: Deploy
      id: deploy
      if: >-
        github.event.action != 'closed' && (!github.event.pull_request || inputs.preview-deploy-key)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONVEX_DEPLOY_KEY:
          ${{ github.event.pull_request && inputs.preview-deploy-key || inputs.deploy-key }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        IFS=: read -r kind first second <<< "${CONVEX_DEPLOY_KEY%%|*}"
        if [ -n "$PR" ] && [ "$kind" != preview ]; then
          echo "::error::preview-deploy-key is not a preview deploy key (preview:...). Convex was not deployed: npx convex deploy with a production key ignores --preview-name and deploys the pull request to production."
          exit 1
        fi
        if [ -z "$PR" ] && [ -z "$CONVEX_DEPLOY_KEY" ]; then
          echo "::error::deploy-key is empty. Outside a pull request the action deploys to production, with the production deploy key."
          exit 1
        fi
        if [ -z "$PR" ] && [ "$kind" != prod ]; then
          echo "::error::deploy-key is not a production deploy key (prod:...). Outside a pull request the action deploys only to production."
          exit 1
        fi
        args=()
        if [ -n "$PR" ]; then
          args=(--preview-name "pr-$PR")
        fi
        if [ -n "$(jq -r '.scripts.deploy // empty' package.json)" ]; then
          node --run deploy -- "${args[@]}"
        else
          npx convex deploy "${args[@]}"
        fi

        # The site URL. A preview's deploymentUrl, from the management API, ends in .convex.cloud,
        # and its site is the same host with .convex.site. A production key may not call that API
        # (400), so production asks the deployment for CONVEX_SITE_URL, which also holds a custom
        # domain that overrides it.
        if [ "$kind" = preview ]; then
          api() {
            local body
            body=$(curl -sS --fail-with-body -H "Authorization: Bearer $CONVEX_DEPLOY_KEY" "https://api.convex.dev/v1/$1") ||
              { echo "$1: $body" >&2; return 1; }
            printf '%s' "$body"
          }
          id=$(api "teams/$first/projects/$second" | jq -r .id)
          cloud=$(api "projects/$id/list_deployments?deploymentType=preview" |
            jq -r --arg name "pr-$PR" '.[] | select(.previewIdentifier == $name) | .deploymentUrl')
          if ! [[ $cloud =~ ^https://[a-z0-9.-]+\.convex\.cloud$ ]]; then
            echo "::error::The Convex API lists no single preview pr-$PR: $cloud"
            exit 1
          fi
          url=${cloud%.convex.cloud}.convex.site
        else
          url=$(npx convex run --inline-query process.env.CONVEX_SITE_URL | jq -r .)
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"

    # A preview deploy key may read its project's deployments and delete its previews through the
    # management API.
    - name: Delete the preview of the closed pull request
      if: github.event.action == 'closed' && inputs.preview-deploy-key
      shell: bash
      env:
        CONVEX_DEPLOY_KEY: ${{ inputs.preview-deploy-key }}
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        # A re-run of an old closed run must not delete the preview of a reopened pull request.
        state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .state)
        if [ "$state" != closed ]; then
          echo "Pull request $PR is $state again, so its preview stays."
          exit 0
        fi
        IFS=: read -r kind team project <<< "${CONVEX_DEPLOY_KEY%%|*}"
        if [ "$kind" != preview ]; then
          echo "::error::preview-deploy-key is not a preview deploy key (preview:...)."
          exit 1
        fi
        api() {
          local body
          body=$(curl -sS --fail-with-body -H "Authorization: Bearer $CONVEX_DEPLOY_KEY" "https://api.convex.dev/v1/$1" "${@:2}") ||
            { echo "$1: $body" >&2; return 1; }
          printf '%s' "$body"
        }
        id=$(api "teams/$team/projects/$project" | jq -r .id)
        names=$(api "projects/$id/list_deployments?deploymentType=preview" |
          jq -r --arg name "pr-$PR" '.[] | select(.previewIdentifier == $name) | .name')
        if [ -z "$names" ]; then
          echo "No preview named pr-$PR in $project."
        fi
        for name in $names; do
          api "deployments/$name/delete" -X POST > /dev/null
          echo "Deleted the preview pr-$PR ($name) in $project."
        done
