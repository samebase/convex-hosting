packages:
  - "packages/*"
  - "examples/*"

catalog:
  "@convex-dev/auth": 2.0.0-alpha.2
  "@convex-dev/react-query": 0.1.0
  "@edge-runtime/vm": 5.0.0
  "@tanstack/react-router": 1.170.41
  "@tanstack/react-start": 1.168.60
  "@types/node": 24.19.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  convex: 1.46.0
  ignore: 7.0.12
  mime: 4.1.0
  convex-test: 0.0.60
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitest: 5.0.3
  zod: 4.6.5

# Vite+ ships Vite and Vitest. Every package that asks for them gets the Vite+ builds.
overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest

# Wait 7 days before resolving newly published package versions, so the ecosystem has time to
# detect and yank compromised releases before CI installs them.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # TODO(2026-12-01): Recheck once Babel no longer resolves semver 6. semver@6.3.1 is a backport
  # published without provenance after provenance-signed 7.x releases.
  - semver@6.3.1
allowBuilds:
  esbuild: true
