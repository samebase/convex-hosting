packages:
  - "packages/*"
  - "examples/*"

catalog:
  "@convex-dev/auth": 2.0.0-beta.0
  "@convex-dev/react-query": 0.1.0
  "@edge-runtime/vm": 5.0.0
  "@tanstack/react-query": 5.104.4
  "@tanstack/react-router": 1.170.45
  "@tanstack/react-start": 1.169.3
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  convex: 1.47.0
  ignore: 7.0.12
  mime: 4.1.1
  convex-test: 0.0.62
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2
  undici: 8.12.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5
  zod: 4.6.7

# Vite+ ships Vite and Vitest. Every package that asks for them gets the Vite+ builds.
overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest

# Wait 7 days before resolving newly published package versions, so the ecosystem has time to
# detect and yank compromised releases before CI installs them.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # 2.0.0-beta.0 of 2026-10-15; remove after 2026-10-22.
  - "@convex-dev/auth@2.0.0-beta.0"
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # TODO(2026-12-01): Recheck once Babel no longer resolves semver 6. semver@6.3.1 is a backport
  # published without provenance after provenance-signed 7.x releases.
  - semver@6.3.1
allowBuilds:
  esbuild: true
  workerd: false
