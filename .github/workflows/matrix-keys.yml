# Throwaway jobs for the PR 89 deploy action matrix: wrong keys, a missing preview key, and a
# refused site URL read. Never merged.
name: Matrix keys

on:
  push: { branches: [tmp/matrix-keys] }
  pull_request: { types: [opened, synchronize, reopened, closed] }
permissions: { contents: read, pull-requests: read, deployments: write }
jobs:
  # Row 7a: a production-shaped key in preview-deploy-key on a pull request. A fake string, never
  # the real production secret.
  production-key-on-pr:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: ./actions/deploy
        with:
          working-directory: examples/hello-world-assets-only
          deploy-key: ""
          preview-deploy-key: "prod:name|x"
  # Row 7b: a preview key in deploy-key on a push to a branch that is not the default branch.
  preview-key-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: ./actions/deploy
        with:
          working-directory: examples/hello-world-assets-only
          deploy-key: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY_HELLO_WORLD_ASSETS_ONLY }}
  # Row 12: no preview key, on open and on close.
  no-preview-key:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: ./actions/deploy
        with:
          working-directory: examples/hello-world-assets-only
          deploy-key: ""
          preview-deploy-key: ""
  # Row 9: the deploy succeeds and the site URL read is refused. An npx shim fails
  # `npx convex run --inline-query`, which only the action calls (convex-hosting runs the convex
  # binary itself). Same group as the examples job of this preview.
  url-refused:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency: { group: "examples-hello-world-assets-only-${{ github.head_ref }}", queue: max }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: 12.10.1 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version-file: .node-version, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Shim npx so that the inline query fails like a refused key
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          real=$(command -v npx)
          printf '#!/usr/bin/env bash\nif [ "$1" = convex ] && [ "$2" = run ]; then echo "Error: 401 Unauthorized: MissingAccessToken (shim)" >&2; exit 1; fi\nexec %s "$@"\n' "$real" > "$RUNNER_TEMP/shim/npx"
          chmod +x "$RUNNER_TEMP/shim/npx"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
      - id: deploy
        uses: ./actions/deploy
        with:
          working-directory: examples/hello-world-assets-only
          deploy-key: ""
          preview-deploy-key: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY_HELLO_WORLD_ASSETS_ONLY }}
      - if: always()
        env: { URL: "${{ steps.deploy.outputs.url }}", NAME: "${{ steps.deploy.outputs.preview-name }}", OUTCOME: "${{ steps.deploy.outcome }}" }
        run: echo "deploy outcome=$OUTCOME url=[$URL] preview-name=[$NAME]"
