name: CI

# Pushes to main run these checks through release.yml, which calls this workflow before it stages a
# release of the same commit.
on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each example pair is one app on both hosts: examples/<name> on Convex and examples/<name>-workers
  # on a Cloudflare Worker. Their diff, the part that is specific to convex-hosting, is committed as
  # examples/<name>-workers.patch. diff-tree is plumbing, so user diff settings such as
  # diff.algorithm never change the patch.
  examples-diff:
    name: examples-diff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compare each example pair with its committed patch
        run: |
          for pair in tanstack-ssr hello-world-assets-only; do
            git diff-tree -p --full-index "HEAD:examples/$pair" "HEAD:examples/$pair-workers" > "examples/$pair-workers.patch"
          done
          git diff --exit-code -- 'examples/*.patch' || {
            echo "::error::An examples patch is stale. Run pnpm run examples:diff and commit the result."
            exit 1
          }

  # packages/convex-hosting/src/workers-sdk is copied from cloudflare/workers-sdk at the commit
  # in its UPSTREAM file. The sync script writes the copy again, so a hand edit of a copied file
  # fails here; the `synced:` date line is the script's own.
  workers-sdk-sync:
    name: workers-sdk-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Compare the copied files with upstream
        working-directory: packages/convex-hosting
        run: |
          node scripts/sync-workers-sdk.ts
          # Staged, the diff shows a file the branch changed, deleted, or added under the folder.
          git add -A -- src/workers-sdk
          git diff --cached --exit-code -I '^synced: ' -- src/workers-sdk || {
            echo "::error::src/workers-sdk differs from upstream. Run node scripts/sync-workers-sdk.ts and commit the result."
            exit 1
          }

  # Cloudflare's integration fixtures, copied unchanged into src/workers-sdk/fixtures, each run
  # against an anonymous local Convex deployment that the fixture's helper starts. The script
  # compares the outcome with the expected-failures list, so a listed difference from Cloudflare
  # that disappears fails the job too.
  fixtures:
    name: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the fixtures against local deployments
        run: pnpm run test:fixtures

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Reject critical development-tool vulnerabilities
        run: pnpm audit --dev --audit-level=critical

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: supply-chain

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both examples prerender pages, which creates their Convex client at build time. The
      # prerender sends no query, so the URL needs no deployment.
      - name: Build packages and examples
        env:
          VITE_CONVEX_URL: https://placeholder.convex.cloud
        run: pnpm run build

      - name: Check
        run: pnpm run check

      # pnpm pack writes the manifest that release.yml stages, with catalog: versions replaced. An
      # npm: alias in it, such as the catalog's vite, makes npm audit signatures in an app ask for
      # the aliased package at the version of the app's own package of that name.
      - name: Reject npm aliases in the adapter's packed manifest
        working-directory: packages/convex-hosting-tanstack-start
        run: |
          tarball=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          found=$(tar -xOzf "$tarball" package/package.json | jq -r '[.dependencies, .peerDependencies, .devDependencies][] | objects | to_entries[] | select(.value | startswith("npm:")) | "\(.key): \(.value)"')
          if [ -n "$found" ]; then
            echo "::error::The adapter's packed manifest has npm: aliases: $found"
            exit 1
          fi

      # One pkg.pr.new preview per commit for both packages, so a consumer can install a PR build
      # before an npm release. --pnpm packs with pnpm, which resolves catalog and workspace versions.
      - name: Publish preview packages
        run: pnpm exec pkg-pr-new publish --pnpm --packageManager=pnpm './packages/*'
