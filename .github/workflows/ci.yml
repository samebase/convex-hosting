name: CI

# Pushes to main run these checks through release.yml, which calls this workflow before it stages a
# release of the same commit.
on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # examples/tanstack-ssr-workers is examples/tanstack-ssr on a Cloudflare Worker. The excluded
  # files are what is specific to convex-hosting; every other file must stay identical. `-x` matches
  # file names, and each of these names occurs once in the examples.
  examples-diff:
    name: examples-diff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compare the SSR examples
        run: |
          diff -r \
            -x README.md -x package.json -x vite.config.ts -x server.ts -x http.ts \
            -x convex.config.ts -x api.d.ts -x wrangler.jsonc \
            examples/tanstack-ssr examples/tanstack-ssr-workers

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Reject critical development-tool vulnerabilities
        run: pnpm audit --dev --audit-level=critical

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: supply-chain

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both examples prerender pages, which creates their Convex client at build time. The
      # prerender sends no query, so the URL needs no deployment.
      - name: Build packages and examples
        env:
          VITE_CONVEX_URL: https://placeholder.convex.cloud
        run: pnpm run build

      - name: Check
        run: pnpm run check

      # One pkg.pr.new preview per commit for both packages, so a consumer can install a PR build
      # before an npm release. --pnpm packs with pnpm, which resolves catalog and workspace versions.
      - name: Publish preview packages
        run: pnpm exec pkg-pr-new publish --pnpm --packageManager=pnpm './packages/*'
