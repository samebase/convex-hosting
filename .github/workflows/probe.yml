name: Probe (temporary)

# Which management API endpoints a preview deploy key may call. Prints status codes and error codes
# only. Creates one throwaway preview and deletes it.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Probe the management API with the preview deploy key
        working-directory: examples/hello-world-assets-only
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY_HELLO_WORLD_ASSETS_ONLY }}
          PROJECT_ID: "3229427"
          PROBE: probe-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          api=https://api.convex.dev/v1
          prefix=${CONVEX_DEPLOY_KEY%%|*}
          team=$(cut -d: -f2 <<< "$prefix")
          project=$(cut -d: -f3 <<< "$prefix")
          call() {
            local label=$1; shift
            status=$(curl -s -o "$RUNNER_TEMP/body.json" -w '%{http_code}' -H "Authorization: Bearer $CONVEX_DEPLOY_KEY" "$@")
            echo "$label: $status $(jq -r '.code? // empty' "$RUNNER_TEMP/body.json" 2>/dev/null)"
          }
          call "GET list_deployments" "$api/projects/$PROJECT_ID/list_deployments?deploymentType=preview"
          call "GET team list_deployments" "$api/teams/$team/list_deployments"
          call "GET project by slug" "$api/teams/$team/projects/$project"
          call "GET deployment by reference" "$api/teams/$team/projects/$project/deployment?reference=preview%2Fpr-1"
          call "GET project by id" "$api/projects/$PROJECT_ID"
          call "POST create_deployment" -X POST -H 'Content-Type: application/json' \
            -d "{\"type\":\"preview\",\"reference\":\"preview/$PROBE-api\"}" "$api/projects/$PROJECT_ID/create_deployment"
          name=$(jq -r '.name? // empty' "$RUNNER_TEMP/body.json")
          if [ -n "$name" ]; then
            call "GET created deployment" "$api/deployments/$name"
            echo "created previewIdentifier: $(jq -r '.previewIdentifier' "$RUNNER_TEMP/body.json")"
            call "POST delete created deployment" -X POST "$api/deployments/$name/delete"
          fi
          # A preview made the way the deploy makes it, then deleted.
          GITHUB_OUTPUT="$RUNNER_TEMP/out" node --run deploy -- --preview-name "$PROBE" > /dev/null 2>&1 || echo "probe deploy failed"
          url=$(sed -n 's/^url=//p' "$RUNNER_TEMP/out")
          name=$(sed -E 's#^https://([^.]+)\.convex\.site/?$#\1#' <<< "$url")
          call "GET deployment by name" "$api/deployments/$name"
          echo "previewIdentifier matches: $(jq -r --arg p "$PROBE" '.previewIdentifier == $p' "$RUNNER_TEMP/body.json")"
          call "GET list_deployments after deploy" "$api/projects/$PROJECT_ID/list_deployments?deploymentType=preview"
          call "POST delete deployment" -X POST "$api/deployments/$name/delete"
          call "GET deployment after delete" "$api/deployments/$name"
