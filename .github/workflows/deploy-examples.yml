name: Deploy examples

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Each example deploys to its own Convex project, so one failure does not stop the other.
      fail-fast: false
      matrix:
        include:
          - example: tanstack-ssr
            deploy_key: CONVEX_DEPLOY_KEY_TANSTACK_SSR
          - example: tanstack-spa
            deploy_key: CONVEX_DEPLOY_KEY_TANSTACK_SPA
    concurrency:
      group: deploy-${{ matrix.example }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A re-run of an old run checks out its old commit, and its push would put older code over
      # newer code. The concurrency group orders runs; this refuses a stale one.
      - name: Check that this commit is the head of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_SHA is stale: main now points to $head. Convex was not deployed."
            exit 1
          fi

      - name: Deploy example
        working-directory: examples/${{ matrix.example }}
        # An index hands the runner every repository secret; all of them are the examples' Convex
        # deploy keys.
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets[matrix.deploy_key] }} # zizmor: ignore[overprovisioned-secrets]
        run: pnpm run deploy
