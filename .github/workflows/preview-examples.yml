name: Preview examples

# A pull request deploys each example to its preview, named after the branch, and comments the
# links. The close deletes the previews. The shape is docs/deploy.md's preview.yml.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  preview:
    # The action's comment with the preview's links needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write
    # A pull request from a fork gets no secrets.
    if:
      github.event.action != 'closed' && github.event.pull_request.head.repo.full_name ==
      github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Each example deploys to its own Convex project, so one failure does not stop the others.
      fail-fast: false
      matrix:
        include:
          - example: tanstack-ssr
            key: TANSTACK_SSR
          - example: tanstack-spa
            key: TANSTACK_SPA
          - example: hello-world-assets-only
            key: HELLO_WORLD_ASSETS_ONLY
    # All pull requests share each example's preview environment.
    environment:
      name: ${{ matrix.example }} preview
      url: ${{ steps.deploy.outputs.url }}
    # One run at a time per preview, in the order the runs began to wait; the cleanup joins it.
    concurrency:
      group: preview ${{ matrix.example }} ${{ github.head_ref }}
      queue: max
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.12.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy the preview
        id: deploy
        uses: $/actions/preview
        with:
          working-directory: examples/${{ matrix.example }}
          # The preview key in deploy-key: this workflow never names a production key. An index
          # hands the runner every repository secret; all of them are the examples' Convex deploy
          # keys.
          deploy-key: ${{ secrets[format('CONVEX_PREVIEW_DEPLOY_KEY_{0}', matrix.key)] }} # zizmor: ignore[overprovisioned-secrets]

  cleanup:
    permissions:
      contents: read
      pull-requests: write
    if:
      github.event.action == 'closed' && github.event.pull_request.head.repo.full_name ==
      github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: tanstack-ssr
            key: TANSTACK_SSR
          - example: tanstack-spa
            key: TANSTACK_SPA
          - example: hello-world-assets-only
            key: HELLO_WORLD_ASSETS_ONLY
    concurrency:
      group: preview ${{ matrix.example }} ${{ github.head_ref }}
      queue: max
    steps:
      # The same working-directory as the preview job: the comment's header names it.
      - name: Delete the preview
        uses: $/actions/cleanup
        with:
          working-directory: examples/${{ matrix.example }}
          deploy-key: ${{ secrets[format('CONVEX_PREVIEW_DEPLOY_KEY_{0}', matrix.key)] }} # zizmor: ignore[overprovisioned-secrets]
