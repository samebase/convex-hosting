name: Preview TanStack SSR example

on:
  pull_request:
    branches: [main]

# One run per pull request; a newer push waits, so the last deploy is the newest commit.
concurrency:
  group: preview-tanstack-ssr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    # A pull request from a fork gets no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The preview deployment is named after the branch; a second push reuses it. Convex gives the
      # build the deployment's URLs, so the build command also records the site URL for the comment.
      - name: Deploy the preview
        id: deploy
        working-directory: examples/tanstack-ssr
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          # shellcheck disable=SC2016 -- the variables expand in the shell that npx convex deploy starts
          pnpm exec convex-hosting deploy --preview-name "$GITHUB_HEAD_REF" --dist dist/client \
            --build 'pnpm run build && echo "url=$VITE_CONVEX_SITE_URL" >> "$GITHUB_OUTPUT"'

      - name: Post the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: >-
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body
          "Preview of examples/tanstack-ssr: $URL"
